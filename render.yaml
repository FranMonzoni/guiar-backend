# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: guiar-backend
    runtime: node
    # El plan Free no tiene disco persistente: los datos viven en Postgres (Neon).
    plan: free
    region: virginia
    # Las migraciones se aplican en cada deploy, usando DIRECT_URL.
    buildCommand: npm ci && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOCATION_RETENTION_HOURS
        value: "48"
      - key: LOCATION_MIN_INTERVAL_MS
        value: "2000"
      # Valores secretos o propios de cada deploy: se cargan en el dashboard de Render.
      - key: DATABASE_URL # Neon, conexión pooled
        sync: false
      - key: DIRECT_URL # Neon, conexión directa
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGINS
        sync: false
